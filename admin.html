<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dandiya Night admin – DJPS</title>
<style>
body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#fff3c4;color:#102a6b;line-height:1.5}
.wrap{max-width:760px;margin:auto}
h1{margin:0 0 12px}
button,select{font:inherit;font-weight:600;padding:8px 14px;border:0;border-radius:8px;background:#c8103c;color:#fff;cursor:pointer;margin:4px 4px 4px 0}
select{background:#fff;color:#102a6b;border:2px solid #102a6b}
button.alt{background:#102a6b}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.card{background:#fff;border:2px solid #102a6b;border-radius:12px;padding:12px;margin-bottom:12px;word-break:break-word}
.tag{background:#f7b500;border-radius:99px;padding:0 10px;font-size:.85rem}
.warn{color:#c8103c}
.card img{width:120px;border-radius:8px;cursor:zoom-in;margin:6px 0}
.card img.big{width:100%;cursor:zoom-out}
#msg{font-weight:700;color:#c8103c}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dandiya Night admin</h1>
  <div id="out"><button id="login">Sign in with Google</button></div>
  <div id="in" hidden>
    <div class="bar"><b id="who"></b><button class="alt" id="logout">Sign out</button><button class="alt" id="csv">Download CSV</button></div>
    <p id="sum"></p>
    <select id="f"><option value="">All</option><option value="paid">Paid, to verify</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="pending">Payment pending</option></select>
    <div id="rows"></div>
  </div>
  <p id="msg" role="status"></p>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,updateDoc,doc,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CFG={apiKey:"AIzaSyCfrORfOEtBTSaWSq5pLgK465Xyf7Yo8yc",authDomain:"dandiya-ticket.firebaseapp.com",projectId:"dandiya-ticket",appId:"1:977133764200:web:1d751dc90ec0d67fab05dd"};
const ADMIN="ashutoshs123445@gmail.com";   // only this Google account gets in (rules enforce it too)

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app),col=collection(db,"dandiya_registrations");
let all=[];

$("login").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$("msg").textContent="Sign-in failed: "+e.code);
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
  if(u&&u.email!==ADMIN){$("msg").textContent="Not authorised: "+u.email+". This page is for the admin only.";await signOut(auth);return;}
  $("msg").textContent="";$("out").hidden=!!u;$("in").hidden=!u;
  if(u){$("who").textContent=u.email;load();}
});

async function load(){
  try{
    const s=await getDocs(col);
    all=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    draw();
  }catch(e){$("msg").textContent="Could not load: "+e.code;}
}

function draw(){
  const f=$("f").value,ok=all.filter(r=>r.status=="approved").length;
  $("sum").textContent=`${all.length} registered, ${ok} approved (Rs ${ok*200} confirmed)`;
  $("rows").innerHTML=all.filter(r=>!f||r.status==f).map(r=>`<div class="card"><b>${esc(r.name)}</b>, Class ${esc(r.cls)}, Roll ${esc(r.roll)} <span class="tag">${esc(r.status)}</span><br>${esc(r.email)}<br>UTR: ${esc(r.utr||"-")} ${r.flags&&r.flags.length?`<b class="warn">Check: ${esc(r.flags.join(", "))}</b>`:""}<br>${r.shot?`<img src="${esc(r.shot)}" alt="Payment screenshot" data-z="1"><br>`:""}${r.status=="paid"||r.status=="pending"?`<button data-id="${esc(r.id)}" data-s="approved">Approve</button><button class="alt" data-id="${esc(r.id)}" data-s="rejected">Reject</button>`:""}</div>`).join("")||"<p>No registrations.</p>";
}
$("f").onchange=draw;

$("rows").onclick=async e=>{
  const t=e.target;
  if(t.dataset.z)return t.classList.toggle("big");
  if(!t.dataset.id)return;
  try{
    await updateDoc(doc(db,"dandiya_registrations",t.dataset.id),{status:t.dataset.s});
    all.find(r=>r.id==t.dataset.id).status=t.dataset.s;draw();
  }catch(x){$("msg").textContent="Could not update: "+x.code;}
};

$("csv").onclick=()=>{
  const cell=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};
  const rows=[["name","class","roll","email","utr","status","flags"],...all.map(r=>[r.name,r.cls,r.roll,r.email,r.utr,r.status,(r.flags||[]).join(" ")])];
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(cell).join(",")).join("\n")],{type:"text/csv"}));
  a.download="dandiya-registrations.csv";a.click();
};
</script>
</body>
</html>
